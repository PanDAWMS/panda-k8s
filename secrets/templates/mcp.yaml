{{- if and .Values.mcp.enabled (not .Values.mcp.existingTlsSecret) }}
# mcp certs
# Ingest certs from on-disk .pem files, kept separate from panda-certs
# since the MCP server serves its own hostname distinct from panda's.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secrets.fullname" . }}-mcp-certs
type: Opaque
data:
  {{- range $path, $_ := .Files.Glob "files/pandamcp_certs/**.pem" }}
  {{ base $path }}: |-
    {{ $.Files.Get $path | b64enc }}
  {{- end }}
{{- end }}
