[logger]

#########################################
#
# Parameters for logging infrastructure.
# panda-common (pulled in for the task-status consumer's STOMP client,
# see panda-common#75) needs this section to exist just to import cleanly -
# panda-ui's own application logging is unrelated and handled entirely by
# Django's LOGGING config.
loghost=panda.cern.ch
monport-apache=80
method=GET
encoding=url

monurlprefix=/logger/logger/query
logdir=/tmp/panda-logs
nemitters=10
migrated=True

log_level=INFO

rotating_policy=none
rotating_backup_count=1
rotating_max_size=1024
rotating_interval=24
