# Default values for panda-ui-backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: "ghcr.io/pandawms/panda-ui-backend"
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 443
  containerPort: 443

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  fsGroup: 0

db:
  deployment: external  # options: external, kubernetes
  vendor: oracle  # options: oracle, postgresql

persistentvolume:
  create: false
  class: ""
  path: "/mnt/panda-ui-backend-logs"
  size: 50Gi
  selector: true
  sharedPvcName: ""
  subPath: ""

# expected paths inside the container from backend Dockerfile
paths:
  base: /opt/pandaui  # from panda-ui-backend Dockerfile
  config: /data/pandaui/config  # from panda-ui-backend Dockerfile
  logs: /data/pandaui/logs  # from panda-ui-backend Dockerfile
  sandbox: /opt/pandaui/configmap
  certs: /opt/pandaui/etc/cert

autoStart: true

replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

resources: {}
podAnnotations: {}
podSecurityContext: {}
imagePullSecrets: []
securityContext: {}

# Phase 1 task-notification evaluator (ATLASPANDA-1401), disabled by default.
# 30 min now that the event-driven consumer (task_status queue + job_status
# topic) is live-verified - this is a pure safety net, not the primary path,
# so it doesn't need to poll every 5 min anymore.
notificationEvaluator:
  enabled: false
  schedule: "*/30 * * * *"
  resources: {}

# Event-driven notification evaluator: consumes JEDI's panda_ui_task_status ActiveMQ
# queue (see jedi.enableMsgProcessor / panda-common#75) instead of polling. Disabled
# by default - only enable for a cluster where that queue has actually been verified
# to receive real messages, same gating rationale as jedi.enableMsgProcessor.
taskStatusConsumer:
  enabled: false
  resources: {}